<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Job Opportunity Engine public architecture</title>
  <desc id="desc">A recruiter-readable local-first workflow from opportunity intake through deterministic evaluation, frozen preparation, evidence validation, private custody, and human review. Candidate isolation surrounds the workflow, divergence sends changed packets back to human review, and external submission remains outside the runtime.</desc>
  <style>
    .bg { fill: #f7f5f0; } .title { font: 700 34px system-ui, sans-serif; fill: #17212b; } .sub { font: 400 17px system-ui, sans-serif; fill: #53616d; } .box { fill: #fff; stroke: #526878; stroke-width: 2; rx: 13; } .accent { fill: #e7eef0; stroke: #526878; stroke-width: 2; rx: 13; } .boundary { fill: none; stroke: #a4b7be; stroke-width: 2; stroke-dasharray: 7 6; rx: 18; } .label { font: 700 17px system-ui, sans-serif; fill: #17212b; } .small { font: 400 13px system-ui, sans-serif; fill: #53616d; } .arrow { stroke: #527685; stroke-width: 3; fill: none; marker-end: url(#arrow); } .dash { stroke: #a56b26; stroke-width: 2.5; fill: none; stroke-dasharray: 6 5; marker-end: url(#amber); } .held { font: 700 13px system-ui, sans-serif; fill: #8a5a22; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#527685"/></marker>
    <marker id="amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#a56b26"/></marker>
  </defs>
  <rect class="bg" width="1200" height="860"/>
  <text class="title" x="60" y="68">Job Opportunity Engine</text>
  <text class="sub" x="60" y="100">Public architecture: governed career operations in a private, local-first system</text>
  <rect class="boundary" x="54" y="145" width="790" height="620"/>
  <text class="small" x="78" y="176">Candidate/profile isolation · governed evidence · private local custody</text>
  <g transform="translate(92 205)">
    <rect class="box" x="0" y="0" width="205" height="78"/><text class="label" x="102" y="31" text-anchor="middle">Job / opportunity input</text><text class="small" x="102" y="54" text-anchor="middle">collection · intake</text>
    <rect class="box" x="270" y="0" width="205" height="78"/><text class="label" x="372" y="31" text-anchor="middle">Normalize / verify</text><text class="small" x="372" y="54" text-anchor="middle">requirements · identity</text>
    <rect class="box" x="540" y="0" width="205" height="78"/><text class="label" x="642" y="31" text-anchor="middle">Evidence + capabilities</text><text class="small" x="642" y="54" text-anchor="middle">approved matching</text>
    <path class="arrow" d="M205 39H265M475 39H535"/>
    <rect class="box" x="0" y="140" width="205" height="78"/><text class="label" x="102" y="171" text-anchor="middle">Deterministic evaluation</text><text class="small" x="102" y="194" text-anchor="middle">priority · explanation</text>
    <rect class="accent" x="270" y="140" width="205" height="78"/><text class="label" x="372" y="171" text-anchor="middle">Preparation command</text><text class="small" x="372" y="194" text-anchor="middle">eligibility gate</text>
    <rect class="accent" x="540" y="140" width="205" height="78"/><text class="label" x="642" y="171" text-anchor="middle">Frozen packet</text><text class="small" x="642" y="194" text-anchor="middle">snapshot authority</text>
    <path class="arrow" d="M642 78V112H102V135M205 179H265M475 179H535"/>
    <rect class="accent" x="0" y="280" width="205" height="78"/><text class="label" x="102" y="311" text-anchor="middle">Claim / evidence validation</text><text class="small" x="102" y="334" text-anchor="middle">deterministic checks</text>
    <rect class="accent" x="270" y="280" width="205" height="78"/><text class="label" x="372" y="311" text-anchor="middle">Private artifact custody</text><text class="small" x="372" y="334" text-anchor="middle">lineage · isolation</text>
    <rect class="accent" x="540" y="280" width="205" height="78"/><text class="label" x="642" y="309" text-anchor="middle">Review state</text><text class="small" x="642" y="331" text-anchor="middle">NEEDS_HUMAN</text><text class="small" x="642" y="348" text-anchor="middle">REVIEW_READY</text>
    <path class="arrow" d="M642 218V252H102V275M205 319H265M475 319H535"/>
    <rect class="box" x="270" y="420" width="205" height="78"/><text class="label" x="372" y="451" text-anchor="middle">Human review</text><text class="small" x="372" y="474" text-anchor="middle">accountable decision</text>
    <path class="arrow" d="M642 358V398H372V415"/>
    <path class="dash" d="M745 319H800V179H750"/><text class="held" x="755" y="400">Divergence → human reconciliation</text>
  </g>
  <rect class="box" x="900" y="240" width="230" height="110"/><text class="label" x="1015" y="278" text-anchor="middle">Outside runtime</text><text class="small" x="1015" y="306" text-anchor="middle">final external submission</text><text class="small" x="1015" y="327" text-anchor="middle">remains human-controlled</text>
  <path class="dash" d="M847 703H895V350"/>
  <text class="sub" x="60" y="814">Preparation may be reviewed; it cannot silently drift from its verified basis or submit itself externally.</text>
</svg>
