<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Response Flow Systems public architecture</title>
  <desc id="desc">An offline deterministic governance workflow showing proposed action, exact approval, evidence and lineage validation, eligibility, and a held future external action boundary.</desc>
  <style>
    .bg { fill: #f7f5f0; } .title { font: 700 34px system-ui, sans-serif; fill: #17212b; } .sub { font: 400 17px system-ui, sans-serif; fill: #53616d; } .box { fill: #ffffff; stroke: #526878; stroke-width: 2; rx: 13; } .box2 { fill: #e7eef0; stroke: #526878; stroke-width: 2; rx: 13; } .held { fill: #f7f5f0; stroke: #8798a0; stroke-width: 2; stroke-dasharray: 9 7; rx: 13; } .label { font: 700 18px system-ui, sans-serif; fill: #17212b; } .small { font: 400 14px system-ui, sans-serif; fill: #53616d; } .arrow { stroke: #527685; stroke-width: 3; fill: none; marker-end: url(#arrow); } .reject { font: 700 16px system-ui, sans-serif; fill: #8b4141; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#527685"/></marker></defs>
  <rect class="bg" width="1200" height="620"/>
  <text class="title" x="60" y="72">Response Flow Systems</text><text class="sub" x="60" y="104">Implemented offline deterministic governance infrastructure</text>
  <g transform="translate(60 205)">
    <rect class="box" x="0" y="0" width="185" height="105"/><text class="label" x="92" y="43" text-anchor="middle">Proposed action</text><text class="small" x="92" y="72" text-anchor="middle">not execution authority</text>
    <rect class="box" x="245" y="0" width="185" height="105"/><text class="label" x="337" y="43" text-anchor="middle">Exact approval</text><text class="small" x="337" y="72" text-anchor="middle">bound to reviewed state</text>
    <rect class="box2" x="490" y="0" width="220" height="105"/><text class="label" x="600" y="37" text-anchor="middle">Evidence + lineage</text><text class="small" x="600" y="64" text-anchor="middle">identity · reply · bounce</text><text class="small" x="600" y="84" text-anchor="middle">eligibility validation</text>
    <rect class="box2" x="770" y="0" width="175" height="105"/><text class="label" x="857" y="43" text-anchor="middle">Eligibility</text><text class="small" x="857" y="72" text-anchor="middle">bounded / no-spend</text>
    <rect class="held" x="1005" y="0" width="145" height="105"/><text class="label" x="1077" y="39" text-anchor="middle">Future</text><text class="small" x="1077" y="65" text-anchor="middle">external action</text><text class="small" x="1077" y="84" text-anchor="middle">held</text>
    <path class="arrow" d="M185 52H240M430 52H485M710 52H765M945 52H1000"/>
  </g>
  <rect class="box" x="285" y="425" width="630" height="80"/><text class="reject" x="600" y="458" text-anchor="middle">Ambiguity fails closed</text><text class="small" x="600" y="483" text-anchor="middle">Malformed, stale, conflicting, or insufficient evidence rejects, pauses, or requires review.</text>
  <text class="sub" x="60" y="565">Live integrations, autonomous sending, and customer-deployment claims are explicitly outside this scope.</text>
</svg>
